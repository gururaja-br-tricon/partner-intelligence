services:
  mcp-server:
    build: .
    command: python -m app.mcp_server.http_server
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    volumes:
      - ./keys:/app/keys:ro

  chat-app:
    build: .
    command: streamlit run app/ui/chat_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - .env.docker
    environment:
      # Overrides whatever MCP_URL is in .env.docker — service-name
      # resolution, not localhost. chat-app and mcp-server are different
      # containers; "localhost" here means this container itself.
      MCP_URL: http://mcp-server:8000/mcp
      ADMIN_APP_URL: http://localhost:8502  # browser-facing, stays localhost
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      - mcp-server

  admin-app:
    build: .
    command: streamlit run app/ui/admin_app.py --server.port 8502 --server.address 0.0.0.0
    ports:
      - "8502:8502"
    env_file:
      - .env.docker
    volumes:
      - ./keys:/app/keys:ro